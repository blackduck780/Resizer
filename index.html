<!DOCTYPE html>
<html>
<head>
<title>🔒 RED-EYE - Universal Image Resizer</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:900px;margin:50px auto;background:#1a1a2e;color:white;padding:20px;}
input,button{width:100%;padding:15px;margin:10px 0;border-radius:12px;border:none;font-size:16px;}
button{background:linear-gradient(45deg,#ff1744,#ff5722);color:white;cursor:pointer;font-weight:600;box-shadow:0 5px 15px rgba(255,23,68,0.3);}
canvas{max-width:100%;border:2px solid #ff1744;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.3);}
#status{padding:15px 20px;background:rgba(255,23,68,0.2);border-radius:12px;font-weight:500;}
.container{padding:30px;background:rgba(255,255,255,0.05);border-radius:20px;backdrop-filter:blur(10px);border:1px solid rgba(255,23,68,0.3);}
.logo{font-size:2.8em;background:linear-gradient(45deg,#ff1744,#ff5722,#ffc107);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:800;text-align:center;margin-bottom:10px;}
</style>
</head>
<body>
<div class="container">
<div class="logo">🔴 RED-EYE</div>
<p style="text-align:center;color:#a0a0a0;margin-bottom:30px;font-size:1.1em;">Universal Image Resizer • Firefox Nightly Optimized • Apache Licensed</p>

<div id="status">👁️ Select image → Resize → Download</div>
<input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/jpg">
<input type="number" id="width" value="800" min="100" max="2000" placeholder="Max Width">
<input type="number" id="height" value="600" min="100" max="2000" placeholder="Max Height">
<button onclick="resizeImage()">🚀 RESIZE WITH RED-EYE</button>

<div id="preview" style="margin-top:30px;"></div>
</div>

<script>
// 🔥 RED-EYE Universal Canvas Resizer - All Browsers
function resizeImage() {
    const fileInput = document.getElementById('fileInput');
    const file = fileInput.files[0];
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');
    
    if (!file) {
        status.textContent = '⚠️ Please select an image first';
        return;
    }
    
    if (!file.type.startsWith('image/')) {
        status.textContent = '⚠️ Please select JPG, PNG, or WebP (under 15MB)';
        return;
    }
    
    status.textContent = '🔴 RED-EYE processing...';
    preview.innerHTML = '';
    
    const img = new Image();
    img.onload = function() {
        const maxW = Math.min(parseInt(document.getElementById('width').value), 2000);
        const maxH = Math.min(parseInt(document.getElementById('height').value), 2000);
        
        // Proportional resize
        const ratio = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight);
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = img.naturalWidth * ratio;
        canvas.height = img.naturalHeight * ratio;
        
        // High quality settings
        ctx.imageSmoothingQuality = 'high';
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        
        // Preview + Download
        preview.innerHTML = `
            <div style="text-align:center;">
                <h3 style="color:#ff1744;">✅ RESIZED SUCCESSFULLY</h3>
                <canvas id="resizedCanvas" style="max-width:100%;border:3px solid #ff1744;border-radius:15px;box-shadow:0 15px 40px rgba(255,23,68,0.3);"></canvas>
                <br><br>
                <a id="downloadLink" style="display:inline-block;background:linear-gradient(45deg,#ff1744,#ff5722);color:white;padding:18px 40px;border-radius:30px;text-decoration:none;font-weight:700;font-size:20px;margin:20px 0;box-shadow:0 15px 40px rgba(255,23,68,0.4);" href="#" download="red-eye-resized.jpg">💾 DOWNLOAD RED-EYE IMAGE</a>
                <p style="color:#a0a0a0;font-size:1.1em;">
                    📏 Original: ${img.naturalWidth}x${img.naturalHeight} 
                    → New: ${canvas.width.toFixed(0)}x${canvas.height.toFixed(0)} 
                    | 📦 ${Math.round(canvas.toDataURL().length*0.0009/1024)}KB
                </p>
            </div>
        `;
        
        const outputCanvas = document.getElementById('resizedCanvas');
        outputCanvas.width = canvas.width;
        outputCanvas.height = canvas.height;
        outputCanvas.getContext('2d').drawImage(canvas, 0, 0);
        
        const downloadLink = document.getElementById('downloadLink');
        downloadLink.href = canvas.toDataURL('image/jpeg', 0.92);
        downloadLink.download = `RED-EYE_${Date.now()}_${file.name.replace(/.[^/.]+$/, '.jpg')}`;
        
        status.innerHTML = `✅ <strong>RED-EYE COMPLETE!</strong> ${canvas.width.toFixed(0)}x${canvas.height.toFixed(0)} ready for download`;
        status.style.background = 'rgba(255,23,68,0.3)';
    };
    
    img.onerror = function() {
        status.innerHTML = '❌ Image failed to load<br><small>Try JPG/PNG under 15MB or different image</small>';
        status.style.background = 'rgba(255,87,34,0.3)';
    };
    
    // Universal FileReader (Firefox Nightly safe)
    const reader = new FileReader();
    reader.onload = (e) => {
        img.src = e.target.result;
    };
    reader.onerror = () => {
        status.textContent = '❌ File read error - Try different image';
    };
    reader.readAsDataURL(file);
}

// Drag & drop support
document.ondragover = () => false;
document.ondrop = (e) => {
    e.preventDefault();
    document.getElementById('fileInput').files = e.dataTransfer.files;
    resizeImage();
};
</script>
</body>
    </html>
