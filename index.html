<!<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Media Studio</title>
    <style>
        /* Base Styles */
        :root {
            --primary: #ff00ff;
            --secondary: #00ffff;
            --accent: #ff00aa;
            --background: #0a0a1a;
            --card-bg: #1a1a2e;
            --text: #ffffff;
            --border: #4a4a6e;
            --shadow: rgba(0, 0, 0, 0.5);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background-color: var(--background);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Header Styles */
        header {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            padding: 1rem;
            text-align: center;
            box-shadow: 0 0 20px var(--accent);
            animation: glow 2s infinite alternate;
        }
        
        @keyframes glow {
            from { box-shadow: 0 0 10px var(--primary); }
            to { box-shadow: 0 0 30px var(--accent); }
        }
        
        h1 {
            font-size: 2.5rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--secondary);
        }
        
        /* Navigation */
        nav {
            background: var(--card-bg);
            padding: 1rem;
            border-bottom: 2px solid var(--border);
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        nav button {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        nav button:hover {
            background: var(--primary);
            color: black;
            box-shadow: 0 0 15px var(--primary);
        }
        
        /* Main Container */
        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        /* Toolbar */
        .toolbar {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 2rem;
            box-shadow: 0 0 10px var(--shadow);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .tool-group {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 0.5rem;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.2);
        }
        
        .tool-label {
            font-weight: bold;
            letter-spacing: 1px;
        }
        
        /* Canvas Container */
        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        
        .preview-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
            box-shadow: 0 0 10px var(--shadow);
        }
        
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .preview-title {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .canvas-wrapper {
            position: relative;
            width: 100%;
            height: 400px;
            background: #000;
            border: 2px dashed var(--border);
            border-radius: 5px;
            overflow: hidden;
        }
        
        canvas {
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        
        /* Controls Panel */
        .controls-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
            box-shadow: 0 0 10px var(--shadow);
        }
        
        .control-group {
            margin-bottom: 1rem;
        }
        
        .control-title {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--secondary);
        }
        
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        input[type="range"] {
            flex: 1;
            height: 8px;
            -webkit-appearance: none;
            background: var(--border);
            border-radius: 5px;
            outline: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            box-shadow: 0 0 10px var(--primary);
        }
        
        .value-display {
            width: 50px;
            text-align: right;
            font-weight: bold;
        }
        
        /* Feature Panels */
        .feature-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 2rem;
            box-shadow: 0 0 10px var(--shadow);
            display: none;
        }
        
        .feature-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .feature-title {
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--secondary);
        }
        
        .close-btn {
            background: transparent;
            border: none;
            color: var(--text);
            cursor: pointer;
            font-size: 1.5rem;
        }
        
        /* Stickers Grid */
        .stickers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 10px;
            margin-top: 1rem;
        }
        
        .sticker-item {
            width: 60px;
            height: 60px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .sticker-item:hover {
            transform: scale(1.1);
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary);
        }
        
        /* Video Controls */
        .video-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 1rem;
        }
        
        .video-btn {
            padding: 0.5rem 1rem;
            background: var(--primary);
            color: black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .video-btn:hover {
            background: var(--secondary);
            box-shadow: 0 0 15px var(--secondary);
        }
        
        /* Status Bar */
        .status-bar {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.5rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 10px var(--shadow);
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
        }
        
        /* DDoS Protection */
        .ddos-protection {
            background: linear-gradient(45deg, var(--primary), var(--accent));
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 2rem;
            text-align: center;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .editor-container {
                grid-template-columns: 1fr;
            }
            
            .toolbar {
                flex-direction: column;
                align-items: center;
            }
            
            nav {
                flex-direction: column;
                align-items: center;
            }
            
            h1 {
                font-size: 1.8rem;
            }
        }
        
        /* Animation Effects */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animated {
            animation: slideIn 0.5s ease-out;
        }
        
        /* Loading Animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <h1>Neon Media Studio</h1>
        <p>Advanced Image & Video Editor with DDoS Protection</p>
    </header>
    
    <!-- Navigation -->
    <nav>
        <button onclick="showPanel('file')">File</button>
        <button onclick="showPanel('edit')">Edit</button>
        <button onclick="showPanel('filters')">Filters</button>
        <button onclick="showPanel('effects')">Effects</button>
        <button onclick="showPanel('tools')">Tools</button>
        <button onclick="showPanel('help')">Help</button>
    </nav>
    
    <!-- DDoS Protection Banner -->
    <div class="ddos-protection">
        <h3>DDoS Protection Active</h3>
        <p>Secure Mode: High | Protection Level: <span id="protection-level">High</span></p>
        <div class="status-indicator"></div>
    </div>
    
    <!-- Main Container -->
    <div class="container">
        <!-- Toolbar -->
        <div class="toolbar">
            <div class="tool-group">
                <span class="tool-label">File:</span>
                <button onclick="openFile()" class="btn">Open</button>
                <button onclick="saveFile()" class="btn">Save</button>
            </div>
            <div class="tool-group">
                <span class="tool-label">Edit:</span>
                <button onclick="undo()" class="btn">Undo</button>
                <button onclick="redo()" class="btn">Redo</button>
                <button onclick="reset()" class="btn">Reset</button>
            </div>
            <div class="tool-group">
                <span class="tool-label">Filters:</span>
                <button onclick="applyFilter('grayscale')" class="btn">Grayscale</button>
                <button onclick="applyFilter('sepia')" class="btn">Sepia</button>
                <button onclick="applyFilter('invert')" class="btn">Invert</button>
            </div>
            <div class="tool-group">
                <span class="tool-label">Effects:</span>
                <button onclick="applyEffect('blur')" class="btn">Blur</button>
                <button onclick="applyEffect('sharpen')" class="btn">Sharpen</button>
                <button onclick="applyEffect('emboss')" class="btn">Emboss</button>
            </div>
            <div class="tool-group">
                <span class="tool-label">Tools:</span>
                <button onclick="showFeaturePanel('crop')" class="btn">Crop</button>
                <button onclick="showFeaturePanel('stickers')" class="btn">Stickers</button>
                <button onclick="showFeaturePanel('video')" class="btn">Video</button>
            </div>
        </div>
        
        <!-- Feature Panels -->
        <div id="file-panel" class="feature-panel animated">
            <div class="feature-header">
                <h2 class="feature-title">File Operations</h2>
                <button class="close-btn" onclick="hidePanel('file')">✕</button>
            </div>
            <div class="control-group">
                <label for="file-select">Select File:</label>
                <select id="file-select" onchange="loadSelectedFile()">
                    <option value="">-- Select File --</option>
                    <option value="image1">sample1.jpg</option>
                    <option value="image2">sample2.png</option>
                    <option value="video1">video1.mp4</option>
                </select>
            </div>
            <div class="control-group">
                <label for="resolution">Resolution:</label>
                <select id="resolution">
                    <option value="original">Original</option>
                    <option value="720p">720p</option>
                    <option value="1080p">1080p</option>
                    <option value="4k">4K</option>
                </select>
            </div>
            <button onclick="convertFile()" class="video-btn">Convert</button>
            <button onclick="compressFile()" class="video-btn">Compress</button>
        </div>
        
        <div id="edit-panel" class="feature-panel animated">
            <div class="feature-header">
                <h2 class="feature-title">Editing Tools</h2>
                <button class="close-btn" onclick="hidePanel('edit')">✕</button>
            </div>
            <div class="control-group">
                <label for="brightness">Brightness:</label>
                <div class="slider-container">
                    <input type="range" id="brightness" min="-100" max="100" value="0" oninput="updateBrightness(this.value)">
                    <span class="value-display" id="brightness-value">0%</span>
                </div>
            </div>
            <div class="control-group">
                <label for="contrast">Contrast:</label>
                <div class="slider-container">
                    <input type="range" id="contrast" min="-100" max="100" value="0" oninput="updateContrast(this.value)">
                    <span class="value-display" id="contrast-value">0%</span>
                </div>
            </div>
            <div class="control-group">
                <label for="saturation">Saturation:</label>
                <div class="slider-container">
                    <input type="range" id="saturation" min="-100" max="100" value="0" oninput="updateSaturation(this.value)">
                    <span class="value-display" id="saturation-value">0%</span>
                </div>
            </div>
            <div class="control-group">
                <label for="sharpness">Sharpness:</label>
                <div class="slider-container">
                    <input type="range" id="sharpness" min="0" max="10" value="0" oninput="updateSharpness(this.value)">
                    <span class="value-display" id="sharpness-value">0</span>
                </div>
            </div>
            <button onclick="applyEdits()" class="video-btn">Apply Edits</button>
        </div>
        
        <div id="filters-panel" class="feature-panel animated">
            <div class="feature-header">
                <h2 class="feature-title">Filters</h2>
                <button class="close-btn" onclick="hidePanel('filters')">✕</button>
            </div>
            <div class="control-group">
                <label for="filter-select">Select Filter:</label>
                <select id="filter-select" onchange="applySelectedFilter()">
                    <option value="">-- Select Filter --</option>
                    <option value="grayscale">Grayscale</option>
                    <option value="sepia">Sepia</option>
                    <option value="invert">Invert</option>
                    <option value="vintage">Vintage</option>
                    <option value="film">Film Grain</option>
                </select>
            </div>
            <div class="control-group">
                <label for="filter-intensity">Intensity:</label>
                <div class="slider-container">
                    <input type="range" id="filter-intensity" min="0" max="100" value="50" oninput="updateFilterIntensity(this.value)">
                    <span class="value-display" id="filter-intensity-value">50%</span>
                </div>
            </div
