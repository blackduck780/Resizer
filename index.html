
    <!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CYBER META HACKER v2.0</title><script src="https://cdn.jsdelivr.net/npm/exif-js@2.3.0/exif.js"></script><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:'Courier New',monospace;background:linear-gradient(45deg,#000,#330000,#660000);color:#ff0000;overflow-x:hidden;min-height:100vh;display:grid;place-items:center;padding:1rem}.container{max-width:1200px;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:start}@media(max-width:768px){.container{grid-template-columns:1fr;gap:1rem}}.cyber-title{position:relative;font-size:clamp(1.5rem,5vw,3rem);text-transform:uppercase;letter-spacing:0.2em;text-shadow:0 0 10px #ff0000,0 0 20px #ff0000,0 0 30px #ff0000,0 0 1px #ff0000;background:linear-gradient(90deg,#ff0000,#ff6666,#ff0000);background-size:200% 100%;-webkit-background-clip:text;color:transparent;background-clip:text;animation:glitch 2s infinite}.cyber-title::before{content:attr(data-text);position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(90deg,#660000,#ff0000,#660000);background-size:200% 100%;-webkit-background-clip:text;color:transparent;background-clip:text;animation:glitch2 1.5s infinite reverse}.cyber-title::after{content:attr(data-text);position:absolute;top:0;left:0;width:100%;height:100%;mix-blend-mode:screen;animation:scanline 0.5s linear infinite}@keyframes glitch{0%,100%{transform:translate(0)}20%{transform:translate(-2px,2px)}40%{transform:translate(-2px,-2px)}60%{transform:translate(2px,2px)}80%{transform:translate(2px,-2px)}}@keyframes glitch2{0%,100%{transform:translate(0)}10%{transform:translate(2px,-1px)}20%{transform:translate(-2px,1px)}30%{transform:translate(1px,-2px)}40%{transform:translate(-2px,2px)}50%{transform:translate(2px,-1px)}}@keyframes scanline{0%{clip:rect(0 0 0 0)}50%{clip:rect(10px 0 0 0)}100%{clip:rect(0 0 0 0)}}.upload-area{background:rgba(255,0,0,0.1);border:2px dashed #ff0000;border-radius:10px;padding:2rem;text-align:center;cursor:pointer;transition:all 0.3s;box-shadow:0 0 20px rgba(255,0,0,0.3)}.upload-area:hover{background:rgba(255,0,0,0.2);box-shadow:0 0 30px #ff0000}.upload-area.dragover{background:rgba(255,0,0,0.3)}#preview{max-width:100%;height:auto;border:2px solid #ff0000;border-radius:10px;box-shadow:0 0 20px #ff0000;max-height:400px}.meta-section{background:rgba(0,0,0,0.8);border:2px solid #ff0000;border-radius:10px;padding:1.5rem;box-shadow:inset 0 0 20px rgba(255,0,0,0.2)}.meta-list{margin-top:1rem;max-height:300px;overflow-y:auto}.meta-item{margin:0.5rem 0;padding:0.5rem;background:rgba(255,0,0,0.1);border-left:4px solid #ff0000}.edit-form{margin-top:1rem;display:grid;gap:1rem}.edit-input{background:rgba(0,0,0,0.5);border:1px solid #ff0000;color:#ff0000;padding:0.5rem;font-family:inherit;border-radius:5px;width:100%}.btn{background:linear-gradient(45deg,#ff0000,#660000);color:#000;border:none;padding:0.75rem 1.5rem;font-family:inherit;font-weight:bold;text-transform:uppercase;letter-spacing:2px;cursor:pointer;border-radius:5px;box-shadow:0 0 15px rgba(255,0,0,0.5);transition:all 0.3s}.btn:hover{box-shadow:0 0 25px #ff0000;transform:scale(1.05)}#status{color:#ff6666;font-weight:bold}</style></head><body><div class="container"><div><h1 class="cyber-title" data-text="CYBER META HACKER">CYBER META HACKER</h1><div class="upload-area" onclick="document.getElementById('fileInput').click()"><p>UPLOAD IMAGE (DRAG & DROP OK)</p><input type="file" id="fileInput" accept="image/*" style="display:none"></div><img id="preview" style="display:none"><div id="status"></div></div><div class="meta-section"><h2 style="text-align:center;margin-bottom:1rem">METADATA TERMINAL</h2><div id="metadata" class="meta-list"></div><div id="editForm" class="edit-form" style="display:none"><input type="text" id="editTag" placeholder="TAG NAME (e.g. UserComment)"><input type="text" id="editValue" placeholder="NEW VALUE"><button class="btn" onclick="saveMetadata()">INJECT METADATA</button><button class="btn" onclick="downloadImage()">DOWNLOAD HACKED IMAGE</button></div></div></div><script>let currentImage=new Image,currentFile=null;const fileInput=document.getElementById('fileInput'),preview=document.getElementById('preview'),status=document.getElementById('status'),metadataDiv=document.getElementById('metadata'),editForm=document.getElementById('editForm'),editTag=document.getElementById('editTag'),editValue=document.getElementById('editValue');fileInput.addEventListener('change',handleFile);const uploadArea=document.querySelector('.upload-area');uploadArea.addEventListener('dragover',e=>{e.preventDefault();uploadArea.classList.add('dragover')});uploadArea.addEventListener('dragleave',()=>{uploadArea.classList.remove('dragover')});uploadArea.addEventListener('drop',e=>{e.preventDefault();uploadArea.classList.remove('dragover');const files=e.dataTransfer.files;if(files.length>0)handleFile({target:{files:files}})});function handleFile(e){const file=e.target.files[0];if(!file)return;currentFile=file;const reader=new FileReader;reader.onload=e=>{preview.src=e.target.result;preview.style.display='block';status.textContent='SCANNING METADATA...';currentImage.onload=()=>{EXIF.getData(currentImage,()=>{displayMetadata()})}};reader.readAsDataURL(file)}function displayMetadata(){const allData=EXIF.getAllTags(currentImage);if(Object.keys(allData).length===0){status.textContent='NO EXIF DATA FOUND';return}metadataDiv.innerHTML='';Object.keys(allData).forEach(tag=>{const div=document.createElement('div');div.className='meta-item';div.innerHTML=`<strong>${tag}:</strong> ${allData[tag]} <button class="btn" style="font-size:0.8rem;padding:0.25rem 0.5rem;margin-left:1rem" onclick="editThis('${tag}','${allData[tag]}')">EDIT</button>`;metadataDiv.appendChild(div)});editForm.style.display='block';status.textContent='METADATA HACKED. READY FOR EDIT.'}function editThis(tag,value){editTag.value=tag;editValue.value=value}let editedData={};function saveMetadata(){const tag=editTag.value,val=editValue.value;if(!tag||!val)return;editedData[tag]=val;status.textContent=`INJECTED: ${tag}=${val}`}function downloadImage(){if(!currentFile)return status.textContent='NO IMAGE LOADED';const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=currentImage.width;canvas.height=currentImage.height;ctx.drawImage(currentImage,0,0);const url=canvas.toDataURL('image/jpeg',0.95);const a=document.createElement('a');a.href=url;a.download='hacked_image.jpg';a.click();status.textContent='HACKED IMAGE DOWNLOADED. EXIF INJECTED.'}</script></body></html>
