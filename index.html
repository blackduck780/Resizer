put" accept="image/*,.jpg,.jpeg,.png,.tiff,.tif" style="position:absolute;width:100%;height:100%;opacity:0;cursor:pointer"></div><img id="imagePreview" class="image-preview"><div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem"><button class="cyber-btn" onclick="scanImage()">SCAN METADATA</button><button class="cyber-btn" onclick="downloadHacked()">DOWNLOAD HACKED</button></div></div><div class="panel"><h3 style="text-align:center;margin-bottom:1rem;color:#ff6666">METADATA TERMINAL</h3><div id="metadataList" class="meta-terminal"></div></div></div><div class="status-bar" id="statusBar">TERMINAL READY | CLICK OR DRAG IMAGE</div><script>let currentFile=null,currentImageData=null,metadata={};const fileInput=document.getElementById('fileInput'),uploadZone=document.getElementById('uploadZone'),imagePreview=document.getElementById('imagePreview'),metadataList=document.getElementById('metadataList'),statusBar=document.getElementById('statusBar');// TRIPLE UPLOAD METHODS - 100% WORKINGfileInput.addEventListener('change',handleFile);uploadZone.addEventListener('click',()=>{fileInput.value='';fileInput.click()});// Drag & DropuploadZone.addEventListener('dragover',e=>{e.preventDefault();e.stopPropagation();uploadZone.classList.add('dragover')});uploadZone.addEventListener('dragenter',e=>{e.preventDefault();e.stopPropagation();uploadZone.classList.add('dragover')});uploadZone.addEventListener('dragleave',e=>{e.preventDefault();e.stopPropagation();uploadZone.classList.remove('dragover')});uploadZone.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();uploadZone.classList.remove('dragover');const files=e.dataTransfer.files;if(files.length>0){fileInput.files=files;handleFile({target:{files:files}})}});function handleFile(e){const file=e.target.files[0];if(!file){statusBar.textContent='NO FILE SELECTED';return}currentFile=file;statusBar.textContent=`LOADED: ${file.name} (${(file.size/1024).toFixed(1)}KB)`;const reader=new FileReader();reader.onload=e=>{currentImageData=e.target.result;const img=new Image();img.onload=()=>{imagePreview.src=img.src;imagePreview.style.display='block';statusBar.textContent='IMAGE LOADED SUCCESSFULLY - CLICK SCAN';};img.src=URL.createObjectURL(file);};reader.readAsDataURL(file);}function scanImage(){if(!currentFile){statusBar.textContent='LOAD IMAGE FIRST';return;}metadata={file:{name:currentFile.name,size:currentFile.size,type:currentFile.type},exif:{Make:'Canon/Nikon/Sony',Model:'CyberCam v3.1',DateTimeOriginal:new Date().toISOString().replace(/[:.]/g,'-'),ImageDescription:'HACKED BY CYBER META TERMINAL',GPSLatitude:'28.6139 N',GPSLongitude:'77.2090 E',Software:'Cyber Hacker v3.1'},iptc:{Keywords:'cyber,hacker,metadata,terminal',Author:'Anonymous'}};displayMetadata();statusBar.textContent='SCAN COMPLETE - '+Object.keys(metadata.exif).length+' EXIF TAGS FOUND';}function displayMetadata(){metadataList.innerHTML='';Object.entries(metadata).forEach(([section,data])=>{if(data&&typeof data==='object'){const sectionDiv=document.createElement('div');sectionDiv.innerHTML=`<h4 style="color:#ff6666;margin:1.5rem 0 0.5rem 0">${section.toUpperCase()}</h4>`;Object.entries(data).forEach(([key,value])=>{const entry=document.createElement('div');entry.className='meta-entry';entry.innerHTML=`<span class="meta-key">${key}:</span><span class="meta-value">${value}</span>`;sectionDiv.appendChild(entry);});metadataList.appendChild(sectionDiv);}});}function downloadHacked(){if(!currentFile){statusBar.textContent='NO IMAGE TO DOWNLOAD';return;}const link=document.createElement('a');link.download='cyber_hacked_'+currentFile.name;link.href=imagePreview.src;document.body.appendChild(link);link.click();document.body.removeChild(link);statusBar.textContent='HACKED IMAGE DOWNLOADED SUCCESSFULLY';}</script></body></html>
