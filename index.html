<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pro Image & Video Editor</title>

<style>
body{margin:0;font-family:system-ui;background:#0b1220;color:#fff}
header{padding:10px;background:#020617;text-align:center;font-size:20px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:#020617}
button{padding:6px 12px;background:#2563eb;border:none;border-radius:4px;color:#fff;cursor:pointer}
button:hover{background:#1d4ed8}
.workspace{padding:10px}
canvas,video{max-width:100%;border:1px solid #334155;margin-top:10px}
input{margin-top:6px}
footer{text-align:center;font-size:12px;opacity:.7;padding:6px}
</style>
</head>

<body>

<header>Pro Image & Video Editor</header>

<div class="toolbar">
  <button onclick="Tools.grayscale()">Grayscale</button>
  <button onclick="Tools.invert()">Invert</button>
  <button onclick="Tools.rotate()">Rotate</button>
  <button onclick="Tools.reset()">Reset</button>

  <button onclick="Tools.playPause()">Play / Pause</button>
  <button onclick="Tools.trim()">Trim 0–5s</button>
  <button onclick="Tools.exportVideo()">Export MP4</button>
</div>

<div class="workspace">
  <input type="file" id="fileInput" accept="image/*,video/*">
  <canvas id="canvas" hidden></canvas>
  <video id="video" controls hidden></video>
</div>

<footer>Apache-2.0 • GitHub Pages • All-in-One Editor</footer>

<!-- FFmpeg.wasm -->
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/ffmpeg.min.js"></script>

<script>
/* ================= SECURITY (DoS BASIC) ================= */
let lastCall=0;
function rateLimit(fn){
  const now=Date.now();
  if(now-lastCall<400)return;
  lastCall=now;fn();
}

/* ================= CORE ================= */
const fileInput=document.getElementById("fileInput");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const video=document.getElementById("video");

let originalImage=null;
let videoFile=null;

/* ================= LOAD FILE ================= */
fileInput.onchange=()=>{
  const f=fileInput.files[0];
  if(!f)return;
  if(f.type.startsWith("image"))loadImage(f);
  else loadVideo(f);
};

/* ================= IMAGE ================= */
function loadImage(file){
  const img=new Image();
  img.onload=()=>{
    canvas.hidden=false;video.hidden=true;
    canvas.width=img.width;canvas.height=img.height;
    ctx.drawImage(img,0,0);
    originalImage=ctx.getImageData(0,0,canvas.width,canvas.height);
  };
  img.src=URL.createObjectURL(file);
}

/* ================= VIDEO ================= */
function loadVideo(file){
  videoFile=file;
  video.hidden=false;canvas.hidden=true;
  video.src=URL.createObjectURL(file);
  video.load();
}

/* ================= TOOLS ================= */
const Tools={
  grayscale(){
    rateLimit(()=>{
      let d=ctx.getImageData(0,0,canvas.width,canvas.height);
      for(let i=0;i<d.data.length;i+=4){
        let a=(d.data[i]+d.data[i+1]+d.data[i+2])/3;
        d.data[i]=d.data[i+1]=d.data[i+2]=a;
      }
      ctx.putImageData(d,0,0);
    });
  },
  invert(){
    rateLimit(()=>{
      let d=ctx.getImageData(0,0,canvas.width,canvas.height);
      for(let i=0;i<d.data.length;i+=4){
        d.data[i]=255-d.data[i];
        d.data[i+1]=255-d.data[i+1];
        d.data[i+2]=255-d.data[i+2];
      }
      ctx.putImageData(d,0,0);
    });
  },
  rotate(){
    rateLimit(()=>{
      const t=document.createElement("canvas");
      t.width=canvas.height;t.height=canvas.width;
      t.getContext("2d").drawImage(canvas,0,0);
      canvas.width=t.width;canvas.height=t.height;
      ctx.save();
      ctx.translate(canvas.width/2,canvas.height/2);
      ctx.rotate(Math.PI/2);
      ctx.drawImage(t,-t.height/2,-t.width/2);
      ctx.restore();
    });
  },
  reset(){
    rateLimit(()=>{if(originalImage)ctx.putImageData(originalImage,0,0)});
  },
  playPause(){
    rateLimit(()=>video.paused?video.play():video.pause());
  },

  /* ===== REAL VIDEO EDITING ===== */
  async trim(){
    if(!videoFile)return alert("Load video first");
    alert("Trimming 0–5 seconds…");
    await runFFmpeg("-i input.mp4 -ss 0 -t 5 -c copy out.mp4");
    video.src=URL.createObjectURL(ffmpegResult);
  },

  async exportVideo(){
    if(!videoFile)return alert("Load video first");
    alert("Exporting MP4…");
    await runFFmpeg("-i input.mp4 -c:v libx264 -c:a aac out.mp4");
    download(ffmpegResult,"edited.mp4");
  }
};

/* ================= FFMPEG CORE ================= */
const { FFmpeg } = FFmpegWASM;
const ffmpeg = new FFmpeg();
let ffmpegResult=null;

async function runFFmpeg(cmd){
  if(!ffmpeg.loaded)await ffmpeg.load({coreURL:"https://unpkg.com/@ffmpeg/core@0.12.6/dist/ffmpeg-core.js"});
  ffmpeg.FS("writeFile","input.mp4",await fetchFile(videoFile));
  await ffmpeg.run(...cmd.split(" "));
  const data=ffmpeg.FS("readFile","out.mp4");
  ffmpegResult=new Blob([data.buffer],{type:"video/mp4"});
}

/* ================= HELPERS ================= */
function download(blob,name){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=name;
  a.click();
}
async function fetchFile(f){
  return new Uint8Array(await f.arrayBuffer());
}
</script>

</body>
</html>
