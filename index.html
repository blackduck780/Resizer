<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="X-UA-Compatible" content="ie=edge"/>
  <meta name="referrer" content="strict-origin-when-cross-origin"/>
  <meta name="robots" content="index, follow"/>
  
  <title>Dark Fast Image Resizer – GitHub Pages</title>
  <meta name="description" content="Resize & compress images in browser – lightweight dark theme"/>
  
  <style>
    :root {
      --bg:      #0d1117;
      --bg-alt:  #161b22;
      --text:    #c9d1d9;
      --text-dim:#8b949e;
      --border:  #30363d;
      --accent:  #58a6ff;
      --accent-dim:#388bfd;
    }

    [data-theme="light"] {
      --bg:      #ffffff;
      --bg-alt:  #f6f8fa;
      --text:    #24292f;
      --text-dim:#57606a;
      --border:  #d0d7de;
      --accent:  #0969da;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      min-height:100%;
      background:var(--bg);
      color:var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height:1.6;
    }
    body { padding:2rem 1rem; max-width:960px; margin:0 auto; }

    header {
      text-align:center;
      padding-bottom:2rem;
      border-bottom:1px solid var(--border);
      margin-bottom:2rem;
    }
    h1 { font-size:clamp(1.8rem,5vw,2.8rem); color:var(--accent); }

    main { display:grid; gap:2rem; }

    .card {
      background:var(--bg-alt);
      border:1px solid var(--border);
      border-radius:12px;
      padding:1.6rem;
    }
    .card h2 { color:var(--accent); margin-bottom:1rem; }

    .upload-zone {
      border:2px dashed var(--border);
      border-radius:12px;
      padding:3rem 1rem;
      text-align:center;
      cursor:pointer;
      transition:0.2s;
    }
    .upload-zone:hover { border-color:var(--accent-dim); background:rgba(88,166,255,0.08); }

    input[type="file"] { display:none; }

    .preview-container {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:1.5rem;
      margin-top:1.5rem;
    }
    .preview-box {
      background:var(--bg);
      border:1px solid var(--border);
      border-radius:10px;
      padding:1rem;
      text-align:center;
    }
    .preview-box img {
      max-width:100%;
      height:auto;
      border-radius:8px;
      margin:0.8rem 0;
    }

    .stats { margin:1rem 0; font-size:0.95rem; color:var(--text-dim); }

    .btn {
      background:var(--accent);
      color:#000;
      border:none;
      padding:0.7rem 1.4rem;
      border-radius:8px;
      cursor:pointer;
      font-weight:500;
      margin:0.5rem;
    }
    .btn:hover { background:var(--accent-dim); }

    .theme-toggle {
      position:fixed;
      top:1rem; right:1rem;
      background:var(--bg-alt);
      border:1px solid var(--border);
      color:var(--text);
      padding:0.5rem 1rem;
      border-radius:8px;
      cursor:pointer;
      z-index:100;
    }

    @media (max-width:500px) {
      body { padding:1.2rem 0.8rem; }
    }
  </style>
</head>
<body>

  <button class="theme-toggle" aria-label="Toggle theme">☀️ / 🌙</button>

  <header>
    <h1>Browser Image Resizer</h1>
    <p class="meta">Dark theme • Client-side only • GitHub Pages friendly • 2026</p>
  </header>

  <main>
    <section class="card">
      <h2>Upload Image to Resize & Compress</h2>
      <p>Reduces large photos (MB → KB) before any upload or download.</p>

      <label for="fileInput" class="upload-zone" id="dropZone">
        <p>Click or drag & drop image here<br>(JPEG, PNG, WebP…)</p>
      </label>
      <input type="file" id="fileInput" accept="image/*">

      <div class="preview-container" id="previewArea"></div>
    </section>

    <section class="card">
      <h2>Settings (adjust & re-process)</h2>
      <label>Max width/height: <input type="number" id="maxSize" value="1200" min="200" max="4000"> px</label><br><br>
      <label>Quality (JPEG/WebP): <input type="range" id="quality" min="0.1" max="1" step="0.05" value="0.82"></label>
      <span id="qualityValue">0.82</span>
    </section>
  </main>

  <script>
    // Theme toggle
    const toggle = document.querySelector('.theme-toggle');
    const html = document.documentElement;
    const saved = localStorage.getItem('theme') ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    html.dataset.theme = saved;
    toggle.textContent = saved === 'dark' ? '☀️ / 🌙' : '🌙 / ☀️';

    toggle.addEventListener('click', () => {
      const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
      html.dataset.theme = next;
      localStorage.setItem('theme', next);
      toggle.textContent = next === 'dark' ? '☀️ / 🌙' : '🌙 / ☀️';
    });

    // Quality display
    const qualitySlider = document.getElementById('quality');
    const qualityVal = document.getElementById('qualityValue');
    qualitySlider.addEventListener('input', () => {
      qualityVal.textContent = qualitySlider.value;
    });

    // Resize logic
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const previewArea = document.getElementById('previewArea');
    const maxSizeInput = document.getElementById('maxSize');

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function resizeAndShow(file) {
      if (!file.type.startsWith('image/')) {
        alert('Please select an image file.');
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');

          let width = img.width;
          let height = img.height;
          const max = parseInt(maxSizeInput.value) || 1200;

          if (width > height) {
            if (width > max) {
              height = Math.round(height * (max / width));
              width = max;
            }
          } else {
            if (height > max) {
              width = Math.round(width * (max / height));
              height = max;
            }
          }

          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          const quality = parseFloat(qualitySlider.value);
          const mime = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
          const dataUrl = canvas.toDataURL(mime, quality);

          // Create preview
          previewArea.innerHTML = `
            <div class="preview-box">
              <strong>Original</strong><br>
              <img src="${e.target.result}" alt="Original">
              <div class="stats">Size: ${formatBytes(file.size)}</div>
            </div>
            <div class="preview-box">
              <strong>Resized & Compressed</strong><br>
              <img src="${dataUrl}" alt="Resized">
              <div class="stats">
                Size ≈ ${formatBytes((dataUrl.length * 3/4))} (estimated)<br>
                ${width} × ${height}
              </div>
              <a href="${dataUrl}" download="resized-image.${mime.split('/')[1]}" class="btn">Download Resized</a>
            </div>
          `;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Events
    fileInput.onchange = e => {
      if (e.target.files[0]) resizeAndShow(e.target.files[0]);
    };

    dropZone.onclick = () => fileInput.click();

    // Drag & drop
    dropZone.ondragover = e => { e.preventDefault(); dropZone.style.borderColor = 'var(--accent)'; };
    dropZone.ondragleave = () => { dropZone.style.borderColor = 'var(--border)'; };
    dropZone.ondrop = e => {
      e.preventDefault();
      dropZone.style.borderColor = 'var(--border)';
      if (e.dataTransfer.files[0]) resizeAndShow(e.dataTransfer.files[0]);
    };

    // Re-process when settings change
    maxSizeInput.addEventListener('change', () => {
      if (fileInput.files[0]) resizeAndShow(fileInput.files[0]);
    });
    qualitySlider.addEventListener('input', () => {
      if (fileInput.files[0]) resizeAndShow(fileInput.files[0]);
    });
  </script>
</body>
  </html>
