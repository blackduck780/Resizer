<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CYBER META HACKER v3.0 - FULL EDITION</title><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:'Courier New',monospace;background:linear-gradient(135deg,#000,#1a0000,#330000,#660000,#990000);color:#ff0000;overflow:hidden;height:100vh;position:relative}.matrix-bg{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;opacity:0.1}.matrix-bg::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 20% 80%,rgba(255,0,0,0.1) 0%,transparent 50%),radial-gradient(circle at 80% 20%,rgba(255,0,0,0.1) 0%,transparent 50%),radial-gradient(circle at 40% 40%,rgba(255,0,0,0.05) 0%,transparent 50%);animation:pulse 4s ease-in-out infinite}.container{position:relative;z-index:2;height:100vh;display:grid;grid-template-rows:80px 1fr 60px;gap:0;padding:1rem;max-width:1400px;margin:0 auto}.cyber-title{position:relative;font-size:clamp(2rem,6vw,4rem);text-transform:uppercase;letter-spacing:0.3em;text-shadow:0 0 15px #ff0000,0 0 30px #ff0000,0 0 45px #ff0000,0 0 60px #ff0000;background:linear-gradient(90deg,#ff0000,#ff4444,#ff0000,#ff6666);background-size:300% 100%;-webkit-background-clip:text;color:transparent;background-clip:text;animation:glitch3 1s infinite}.cyber-title::before{content:attr(data-text);position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(90deg,#660000,#ff0000,#cc0000);background-size:200% 100%;-webkit-background-clip:text;color:transparent;background-clip:text;animation:glitch4 2s infinite reverse}.cyber-title::after{content:attr(data-text);position:absolute;top:0;left:0;width:100%;height:100%;mix-blend-mode:screen;animation:scanline2 0.3s linear infinite}@keyframes glitch3{0%,100%{transform:translate(0);filter:hue-rotate(0deg)}10%{transform:translate(-3px,3px);filter:hue-rotate(10deg)}20%{transform:translate(3px,-3px);filter:hue-rotate(-10deg)}30%{transform:translate(-2px,2px);filter:hue-rotate(20deg)}40%{transform:translate(2px,-2px);filter:hue-rotate(-20deg)}50%{transform:translate(-1px,1px);filter:hue-rotate(30deg)}}@keyframes glitch4{0%,100%{transform:translate(0)}15%{transform:translate(4px,-2px)}30%{transform:translate(-3px,4px)}45%{transform:translate(2px,-3px)}60%{transform:translate(-4px,2px)}75%{transform:translate(3px,-4px)}}@keyframes scanline2{0%{clip:rect(0 0 0 0)}40%{clip:rect(20px 0 0 0)}80%{clip:rect(0 0 20px 0)}100%{clip:rect(0 0 0 0)}}@keyframes pulse{0%,100%{opacity:0.1;transform:scale(1)}50%{opacity:0.2;transform:scale(1.05)}}.main-grid{display:grid;grid-template-columns:1fr 1fr;gap:2rem;height:100%;}@media(max-width:1024px){.main-grid{grid-template-columns:1fr;gap:1rem}}.panel{background:rgba(0,0,0,0.9);border:2px solid #ff0000;border-radius:15px;padding:1.5rem;box-shadow:0 0 30px rgba(255,0,0,0.4),inset 0 0 20px rgba(255,0,0,0.1);position:relative;overflow:hidden}.panel::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:2px;background:linear-gradient(90deg,transparent,#ff0000,transparent);animation:shine 3s infinite}.panel::after{content:'TERMINAL ACTIVE';position:absolute;top:10px;right:15px;font-size:0.7rem;color:rgba(255,0,0,0.5);letter-spacing:2px}@keyframes shine{0%{left:-100%}50%{left:100%}100%{left:100%}}.upload-zone{background:rgba(255,0,0,0.15);border:3px dashed #ff0000;border-radius:12px;padding:2rem;text-align:center;cursor:pointer;transition:all 0.3s;position:relative;overflow:hidden}.upload-zone::before{content:'DRAG OR CLICK';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.2rem;letter-spacing:3px;color:#ff6666}.upload-zone:hover{background:rgba(255,0,0,0.25);border-color:#ff6666;box-shadow:0 0 40px rgba(255,0,0,0.6);transform:scale(1.02)}.upload-zone.dragover{background:rgba(255,0,0,0.4);border-color:#ff9999}.image-preview{max-width:100%;max-height:400px;border:3px solid #ff0000;border-radius:12px;box-shadow:0 0 30px rgba(255,0,0,0.6);display:none}.meta-terminal{max-height:500px;overflow-y:auto;padding-right:1rem}.meta-entry{margin:1rem 0;padding:1rem;background:rgba(255,0,0,0.1);border-left:5px solid #ff0000;border-radius:8px;position:relative;transition:all 0.3s;cursor:pointer}.meta-entry:hover{background:rgba(255,0,0,0.2);box-shadow:0 0 20px rgba(255,0,0,0.3)}.meta-key{font-weight:bold;color:#ff6666;margin-right:1rem}.meta-value{color:#ffcccc;word-break:break-all}.hex-viewer{font-family:monospace;font-size:0.8rem;background:rgba(0,0,0,0.5);border:1px solid #ff0000;padding:1rem;border-radius:8px;max-height:200px;overflow:auto;display:none}.control-panel{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem}.cyber-btn{background:linear-gradient(45deg,#ff0000,#cc0000,#ff0000);color:#000;border:none;padding:1rem;font-family:'Courier New',monospace;font-weight:bold;text-transform:uppercase;letter-spacing:3px;cursor:pointer;border-radius:8px;box-shadow:0 0 20px rgba(255,0,0,0.6);transition:all 0.3s;position:relative;overflow:hidden}.cyber-btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);transition:0.5s}.cyber-btn:hover{box-shadow:0 0 40px #ff0000;transform:translateY(-2px);color:#fff}.cyber-btn:hover::before{left:100%}.status-bar{background:rgba(0,0,0,0.8);border:1px solid #ff0000;border-radius:10px;padding:1rem;text-align:center;font-weight:bold;color:#ff6666;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:90%;max-width:800px;z-index:1000}.edit-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:10000;justify-content:center;align-items:center}.edit-panel{background:rgba(0,0,0,0.95);border:3px solid #ff0000;border-radius:20px;padding:3rem;width:90%;max-width:600px;max-height:80vh;overflow-y:auto}.edit-inputs{display:grid;gap:1.5rem}.cyber-input{background:rgba(0,0,0,0.8);border:2px solid #ff0000;color:#ff0000;padding:1.5rem;font-family:'Courier New',monospace;font-size:1.1rem;border-radius:10px;width:100%;letter-spacing:1px}.cyber-input:focus{outline:none;border-color:#ff6666;box-shadow:0 0 30px rgba(255,0,0,0.5)}@media(max-width:768px){.container{padding:0.5rem}.main-grid{grid-template-columns:1fr}.control-panel{grid-template-columns:1fr}}</style></head><body><canvas class="matrix-bg" id="matrix"></canvas><div class="container"><header><h1 class="cyber-title" data-text="CYBER META HACKER v3.0">CYBER META HACKER v3.0</h1></header><div class="main-grid"><div class="panel"><div class="upload-zone" id="uploadZone"><input type="file" id="fileInput" accept="image/*" style="display:none"></div><img id="imagePreview" class="image-preview" alt="Preview"><div class="control-panel"><button class="cyber-btn" onclick="analyzeImage()">DEEP SCAN</button><button class="cyber-btn" onclick="showHexViewer()">HEX DUMP</button></div><div id="statusDisplay"></div></div><div class="panel"><h3 style="text-align:center;margin-bottom:1rem;color:#ff6666">METADATA TERMINAL</h3><div id="metadataList" class="meta-terminal"></div><div class="control-panel"><button class="cyber-btn" onclick="batchEdit()">BATCH HACK</button><button class="cyber-btn" onclick="exportImage()">DEPLOY HACKED</button></div><div id="hexViewer" class="hex-viewer"></div></div></div></div><div class="status-bar" id="statusBar">READY FOR HACK | 0x00 TERMINAL ONLINE</div><div class="edit-modal" id="editModal"><div class="edit-panel"><h2 style="text-align:center;margin-bottom:2rem">METADATA INJECTION</h2><div class="edit-inputs"><input type="text" id="editKey" class="cyber-input" placeholder="TAG NAME (EX: ImageDescription)"><input type="text" id="editValue" class="cyber-input" placeholder="INJECTED VALUE"><select id="editSection" class="cyber-input"><option value="EXIF">EXIF</option><option value="IPTC">IPTC</option><option value="XMP">XMP</option></select></div><div style="text-align:center;margin-top:2rem"><button class="cyber-btn" style="margin:0 1rem" onclick="injectMetadata()">INJECT</button><button class="cyber-btn" style="margin:0 1rem;background:linear-gradient(45deg,#660000,#000)" onclick="closeEditModal()">ABORT</button></div></div></div><script>let currentImageData=null,currentFile=null,metadataStore={},originalArrayBuffer=null;const fileInput=document.getElementById('fileInput'),uploadZone=document.getElementById('uploadZone'),imagePreview=document.getElementById('imagePreview'),metadataList=document.getElementById('metadataList'),statusDisplay=document.getElementById('statusDisplay'),statusBar=document.getElementById('statusBar'),hexViewer=document.getElementById('hexViewer'),editModal=document.getElementById('editModal'),matrix=document.getElementById('matrix');fileInput.addEventListener('change',handleFileUpload);uploadZone.addEventListener('click',()=>fileInput.click());['dragover','dragenter'].forEach(event=>uploadZone.addEventListener(event,e=>{e.preventDefault();e.stopPropagation();uploadZone.classList.add('dragover')}));['dragleave','drop'].forEach(event=>uploadZone.addEventListener(event,e=>{e.preventDefault();e.stopPropagation();uploadZone.classList.remove('dragover');if(event==='drop'&&e.dataTransfer.files[0])handleFileUpload({target:{files:[e.dataTransfer.files[0]]}})}));function handleFileUpload(e){const file=e.target.files[0];if(!file)return;currentFile=file;statusBar.textContent=`LOADING ${file.name} | SIZE: ${(file.size/1024/1024).toFixed(2)}MB`;const reader=new FileReader();reader.onload=e=>{originalArrayBuffer=e.target.result;currentImageData=new Uint8Array(e.target.result);imagePreview.src=URL.createObjectURL(file);imagePreview.style.display='block';statusBar.textContent='DEEP SCANNING METADATA...';setTimeout(analyzeImage,500)}}async function analyzeImage(){if(!currentImageData)return;statusBar.textContent='ANALYZING EXIF/IPTC/XMP...';metadataStore=await extractAllMetadata(currentImageData);displayMetadata();statusBar.textContent='SCAN COMPLETE | '+Object.keys(metadataStore).length+' TAGS FOUND'}async function extractAllMetadata(buffer){const metadata={};try{metadata.exif=await parseEXIF(buffer);metadata.iptc=await parseIPTC(buffer);metadata.xmp=await parseXMP(buffer);metadata.file={name:currentFile.name,size:currentFile.size,type:currentFile.type,lastModified:new Date(currentFile.lastModified).toISOString()};const img=new Image();img.onload=()=>{metadata.dimensions={width:img.naturalWidth,height:img.naturalHeight}};img.src=URL.createObjectURL(currentFile)}catch(e){console.error('Metadata parse error:',e)}return metadata}async function parseEXIF(buffer){const exif={};// Simulate comprehensive EXIF parsing - in production use piexifjs or similar// For demo: extract common headers and simulate dataif(buffer.length>100){exif.Make='Canon/Nikon/Sony';exif.Model='Camera Model';exif.DateTimeOriginal=new Date().toISOString();exif.Software='v3.0 Cyber Hacker';exif.ImageDescription='HACKED BY CYBER META TERMINAL';exif.Orientation=1;exif.XResolution=72;exif.YResolution=72;exif.ResolutionUnit=2;exif.YCbCrPositioning=1;exif.ExifVersion='0220';exif.DateTimeDigitized=new Date().toISOString()}return exif}async function parseIPTC(buffer){return{Keywords:['cyber','hacker','metadata'],Creator:'Anonymous',City:'Cyber City',Country:'Matrix'}}async function parseXMP(buffer){return{CreatorTool:'Cyber Meta Hacker v3.0',CreateDate:new Date().toISOString(),MetadataDate:new Date().toISOString()}}function displayMetadata(){metadataList.innerHTML='';const sections=['file','exif','iptc','xmp'];sections.forEach(section=>{if(metadataStore[section]&&Object.keys(metadataStore[section]).length>0){const sectionDiv=document.createElement('div');sectionDiv.innerHTML=`<h4 style="color:#ff6666;margin:1rem 0 0.5rem 0">${section.toUpperCase()}</h4>`;Object.entries(metadataStore[section]).forEach(([key,value])=>{const entry=document.createElement('div');entry.className='meta-entry';entry.innerHTML=`<span class="meta-key">${key}:</span><span class="meta-value">${value}</span><button class="cyber-btn" style="position:absolute;right:1rem;top:1rem;font-size:0.8rem;padding:0.3rem 0.6rem" onclick="editMetadata('${section}','${key}')">EDIT</button>`;entry.onclick=()=>editMetadata(section,key);sectionDiv.appendChild(entry)});metadataList.appendChild(sectionDiv)}})}function editMetadata(section,key){document.getElementById('editKey').value=key;document.getElementById('editSection').value=section;editModal.style.display='flex'}function closeEditModal(){editModal.style.display='none'}function injectMetadata(){const key=document.getElementById('editKey').value,value=document.getElementById('editValue').value,section=document.getElementById('editSection').value;if(!key||!value)return;metadataStore[section][key]=value;statusBar.textContent=`INJECTED ${section.toUpperCase()}.${key}`;displayMetadata();closeEditModal();document.getElementById('editValue').value=''}function batchEdit(){if(confirm('EXECUTE BATCH METADATA WIPE/INJECT?')){Object.keys(metadataStore.exif||{}).forEach(key=>metadataStore.exif[key]='[HACKED]');displayMetadata();statusBar.textContent='BATCH HACK COMPLETE'}}function showHexViewer(){if(!currentImageData)return;const hexStr=Array.from(currentImageData.slice(0,1024)).map(b=>b.toString(16).padStart(2,'0')).join(' ');hexViewer.innerHTML=`<strong>FIRST 512 BYTES HEX DUMP:</strong><pre>${hexStr}</pre>`;hexViewer.style.display='block';statusBar.textContent='HEX VIEWER ACTIVE'}function exportImage(){if(!currentImageData)return;const modifiedData=modifyImageWithMetadata(currentImageData,metadataStore);const blob=new Blob([modifiedData],{type:currentFile.type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='cyber_hacked_'+currentFile.name;a.click();statusBar.textContent='HACKED IMAGE DEPLOYED | '+Object.keys(metadataStore).length+' TAGS INJECTED'}function modifyImageWithMetadata(buffer,metadata){const newBuffer=new Uint8Array(buffer);// Simulate metadata injection by modifying bytes 100-200for(let i=100;i<200&&i<buffer.length;i++){newBuffer[i]=(buffer[i]+Math.floor(Math.random()*10))%256}return newBuffer}// Matrix background animationfunction initMatrix(){const ctx=matrix.getContext('2d');matrix.width=window.innerWidth;matrix.height=window.innerHeight;let chars='01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';let fontSize=14;let columns=canvas.width/fontSize;let drops=[];for(let i=0;i<columns;i++)drops[i]=1;function draw(){ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#ff0000';ctx.font=fontSize+'px monospace';for(let i=0;i<drops.length;i++){const text=chars[Math.floor(Math.random()*chars.length)];ctx.fillText(text,i*fontSize,drops[i]*fontSize);drops[i]++;if(drops[i]*fontSize>canvas.height&&Math.random()>0.975)drops[i]=0}}setInterval(draw,50)}window.addEventListener('load',initMatrix);window.addEventListener('resize',()=>location.reload());</script></body></html>
